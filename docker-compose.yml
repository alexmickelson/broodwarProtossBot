services:
  broodwar-bot-1:
    build:
      context: .
      dockerfile: protossbot/Dockerfile
    container_name: broodwar-protoss-bot-1
    ports:
      - 5901:5900
      - 3001:3000
      - 6112:6112/udp
    restart: unless-stopped
    networks:
      - broodwar-network

  broodwar-bot-2:
    build:
      context: .
      dockerfile: protossbot/Dockerfile
    container_name: broodwar-protoss-bot-2
    ports:
      - 5902:5900
      - 3002:3000
      - 6113:6112/udp
    restart: unless-stopped
    networks:
      - broodwar-network

  broodwar-bot-3:
    build:
      context: .
      dockerfile: protossbot/Dockerfile
    container_name: broodwar-protoss-bot-3
    ports:
      - 5903:5900
      - 3003:3000
      - 6114:6112/udp
    restart: unless-stopped
    networks:
      - broodwar-network

  novnc-bot-1:
    build:
      context: .
      dockerfile: novnc.Dockerfile
      args:
        VNC_SERVER: broodwar-bot-1:5900
    container_name: novnc-viewer-bot-1
    ports:
      - 6081:6080
    restart: unless-stopped
    networks:
      - broodwar-network
    depends_on:
      - broodwar-bot-1

  novnc-bot-2:
    build:
      context: .
      dockerfile: novnc.Dockerfile
      args:
        VNC_SERVER: broodwar-bot-2:5900
    container_name: novnc-viewer-bot-2
    ports:
      - 6082:6080
    restart: unless-stopped
    networks:
      - broodwar-network
    depends_on:
      - broodwar-bot-2

  novnc-bot-3:
    build:
      context: .
      dockerfile: novnc.Dockerfile
      args:
        VNC_SERVER: broodwar-bot-3:5900
    container_name: novnc-viewer-bot-3
    ports:
      - 6083:6080
    restart: unless-stopped
    networks:
      - broodwar-network
    depends_on:
      - broodwar-bot-3

networks:
  broodwar-network:
    driver: bridge
